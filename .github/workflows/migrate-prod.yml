name: Migrate prod DB

# Auto-applies Drizzle migrations to the Neon production DB on every push
# to main. Runs in parallel with Vercel's auto-deploy — for most pushes this
# is harmless because:
#   • migrations are idempotent (Drizzle skips already-applied entries via the
#     __drizzle_migrations journal table)
#   • on schema-additive changes (new columns / tables) the code can run
#     against either the old or new schema briefly during deploy
#
# For destructive migrations (dropping a column the code still reads), you
# should still run them manually with the new code deployed first, or coordinate
# downtime — this workflow is NOT a substitute for thinking about migration safety.
#
# Setup: add a GitHub Actions secret named `PROD_DATABASE_URL` pointing at the
# Neon prod connection string (the same URL Vercel uses for DATABASE_URL).

on:
  push:
    branches: [main]
    paths:
      - 'packages/db/src/migrations/**'
      - 'packages/db/drizzle.config.ts'
      - '.github/workflows/migrate-prod.yml'
  workflow_dispatch:  # manual trigger from Actions tab for one-offs

concurrency:
  group: migrate-prod
  cancel-in-progress: false   # never cancel a migration mid-run

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Production    # enables environment-scoped secrets + (optional) approval gate

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: List pending migrations
        run: ls -la packages/db/src/migrations/

      - name: Apply migrations to Neon prod
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: pnpm --filter @smanga/db migrate
