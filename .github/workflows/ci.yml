name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smanga
          POSTGRES_PASSWORD: smanga_dev
          POSTGRES_DB: smanga
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smanga -d smanga"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://smanga:smanga_dev@localhost:5432/smanga
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-32-bytes-of-padding-here-ok-ok

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (biome)
        run: pnpm lint

      - name: Typecheck all packages
        run: pnpm typecheck

      - name: Unit + integration tests
        run: pnpm test

      - name: Build API
        run: pnpm --filter @smanga/api build

      - name: Build frontend
        run: pnpm --filter @smanga/frontend build
