version: 2

updates:
  # GitHub Actions — would have caught the Node 20 deprecation 10+ days
  # earlier instead of waiting for the runner annotation.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # npm / pnpm workspace — single root because pnpm-lock.yaml at root covers
  # all workspace packages.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 10
    groups:
      production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    ignore:
      # Pin pnpm itself to the version in packageManager — bump explicitly
      # when ready (avoids mid-monorepo lockfile bitrot).
      - dependency-name: "pnpm"
      # Major bumps with substantial breaking changes — bump manually in a
      # dedicated commit when ready to do the migration. Minor/patch still
      # come through automatically.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@biomejs/biome"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
