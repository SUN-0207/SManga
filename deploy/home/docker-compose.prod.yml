services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - random_page_cost=1.1
    mem_limit: 2g
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: smanga
      POSTGRES_USER: smanga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smanga -d smanga"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes", "--maxmemory", "768mb", "--maxmemory-policy", "noeviction"]
    # mem_limit must be well above --maxmemory (768mb): RSS spikes during AOF
    # load/rewrite (copy-on-write). 1g was too tight → Docker OOM-killed Redis on
    # boot → restart-loop → API crash-looped on `LOADING` (2026-06-12 incident).
    # ~2.5x maxmemory leaves headroom. Host has 15Gi.
    mem_limit: 2g
    stop_grace_period: 30s
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  api:
    image: ghcr.io/${GHCR_OWNER}/smanga-api:latest
    restart: unless-stopped
    # Headroom above the 1024MB V8 heap (NODE_OPTIONS) for native buffers
    # (zlib threadpool, cheerio DOM, undici) + Bull workers + 25 PG conns.
    # 1.5g was uncomfortably tight; 2g avoids an OOM-loop. Host has 15Gi.
    mem_limit: 2g
    stop_grace_period: 90s
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: "3001"
      NODE_OPTIONS: "--max-old-space-size=1024"
      DB_POOL_MAX: "25"
      DATABASE_URL: postgres://smanga:${POSTGRES_PASSWORD}@postgres:5432/smanga
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_BASE_URL: https://smanga.shop
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      AUTH_GOOGLE_CALLBACK_URL: https://smanga.shop/api/v1/auth/google/callback
    command: ["sh", "-c", "pnpm --filter @smanga/db migrate && node apps/api/dist/main.js"]
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s

  frontend:
    image: ghcr.io/${GHCR_OWNER}/smanga-frontend:latest
    restart: unless-stopped
    stop_grace_period: 15s
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api, frontend]
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

  watchtower:
    # containrrr/watchtower upstream stalled at v1.7.1 (2023) — its Docker
    # client lib is API 1.25, rejected by Docker engine v29+ which needs
    # API ≥1.40. nickfedor/watchtower is the actively-maintained fork
    # with up-to-date docker/docker SDK.
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"

volumes:
  postgres-data:
  redis-data:
