server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hash-busted Vite assets — 1y immutable cache
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html must always revalidate — without this, the browser
  # heuristic-caches it for hours and serves a stale shell that
  # references deleted /assets/*.js hashes from the previous deploy.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    expires 0;
  }

  # SPA fallback — all non-asset URLs serve index.html (also no-cache)
  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    expires 0;
    try_files $uri /index.html;
  }
}
