server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hash-busted Vite assets — 1y immutable cache
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback — all non-asset URLs serve index.html
  location / {
    try_files $uri /index.html;
  }
}
