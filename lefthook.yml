# Lefthook config — local pre-commit hooks.
# Installed by `pnpm install` via the root `prepare` script.
# Skip once: `LEFTHOOK=0 git commit ...`  or  `git commit --no-verify`.

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{ts,tsx,js,jsx,json,jsonc}"
      run: pnpm exec biome check --no-errors-on-unmatched {staged_files}

    typecheck:
      # Typecheck the whole monorepo — TS can't be scoped to staged files
      # without losing cross-package guarantees. ~10-15s on warm cache.
      glob: "*.{ts,tsx}"
      run: pnpm typecheck
